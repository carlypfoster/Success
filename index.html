 else h+=`<h3>If we target</h3><p><b>${desc}</b></p><p>${L(T.M)} learners (${P(T.M,n)} of those in view)</p>
<h3><i class="sw" style="background:var(--dot)"></i>We would find</h3><div style="${big}">${L(T.X)} <span style="font-size:14px;font-weight:400">of ${L(T.n)} (${P(T.X,T.n)})</span></div>
<h3><i class="sw" style="background:var(--fif)"></i>We would miss</h3><div style="${big}">${L(miss)} <span style="font-size:14px;font-weight:400">(${P(miss,T.n)})</span></div>
<div style="display:flex;height:10px;border-radius:3px;overflow:hidden;margin-top:8px"><div style="width:${T.n?T.X/T.n*100:0}%;background:var(--dot)"></div><div style="flex:1;background:var(--fif)"></div></div>
<p style="margin-top:12px;color:var(--mut)">We would also contact ${L(T.M-T.X)} learners who are not in this group.</p>`;
 h+=`<h3>Retention</h3>`+rr("Whole cohort in view",T.C)+rr("The "+L(T.n)+" (both flags)",T.Tt)+(sel?rr("Selected group",T.H):"")
 +`<p style="margin-top:10px;font-size:12px;color:var(--mut)">% retained leaves out excluded learners, who are counted alongside. Of ${L(T.C[1])} learners who did not return, the ${L(T.n)} contain ${L(T.Tt[1])} (${P1(T.Tt[1],T.C[1])})${sel?`; the selected group contains ${L(T.H[1])} (${P1(T.H[1],T.C[1])})`:""}.</p>`;
 $("side").innerHTML=h;}
addEventListener("resize",draw);matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);draw();
</script></body></html>
